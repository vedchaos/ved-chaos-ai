services:
  - type: web
    name: ved-chaos-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --sse
    envVars:
      - key: MCP_TRANSPORT
        value: sse
      - key: VED_USER_ID
        value: ved-cloud
      - key: DATABASE_URL
        sync: false
